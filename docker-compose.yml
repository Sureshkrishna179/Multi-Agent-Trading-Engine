version: '3.8'

services:
  # 1. Professional React / FastAPI Terminal (Port 8000)
  terminal:
    build: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - EXECUTION_MODE=PAPER
    volumes:
      - ./.cache:/app/.cache

  # 2. 24/7 Autonomous Background Scanner (Scans every 15 min even if nobody is on the website)
  daemon:
    build: .
    restart: always
    command: ["python", "daemon.py"]
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - EXECUTION_MODE=PAPER
    volumes:
      - ./.cache:/app/.cache
